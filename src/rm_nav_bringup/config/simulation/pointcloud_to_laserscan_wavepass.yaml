pointcloud_to_laserscan:
  ros__parameters:
    target_frame: 'livox_frame'
    transform_tolerance: 0.01
    min_height: -1.0
    max_height: 0.05
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0043
    scan_time: 0.3333
    range_min: 0.55
    range_max: 10.0
    use_inf: true
    inf_epsilon: 1.0
