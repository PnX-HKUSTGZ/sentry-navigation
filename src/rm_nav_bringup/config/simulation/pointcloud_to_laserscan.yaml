pointcloud_to_laserscan:
  ros__parameters:
    target_frame: 'livox_frame'
    transform_tolerance: 0.01
    min_height: -1.0
    max_height: 0.1
    angle_min: -3.14159  # -M_PI
    angle_max: 3.14159   # M_PI
    angle_increment: 0.0043  # M_PI/360.0
    scan_time: 0.3333
    range_min: 0.45
    range_max: 10.0
    use_inf: true
    inf_epsilon: 1.0