pointcloud_to_laserscan:
  ros__parameters:
    target_frame: 'livox_frame'
    transform_tolerance: 0.01
    min_height: -1.2
    max_height: 0.2
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.001745
    scan_time: 0.10
    range_min: 0.20
    range_max: 12.0
    use_inf: true
    inf_epsilon: 1.0
