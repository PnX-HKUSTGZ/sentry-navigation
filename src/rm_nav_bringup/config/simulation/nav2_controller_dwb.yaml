controller_server:
  ros__parameters:
    use_sim_time: True
    # For FAST-LIO2 + small-gicp pipeline, use LIO odometry topic.
    odom_topic: /Odometry
    controller_frequency: 12.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.001
    # Wave-road runs with speed limiting can look "stuck" to progress checker.
    # Relax tolerance to avoid false aborts while preserving safety via costmaps.
    failure_tolerance: 0.8
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.04
      movement_time_allowance: 24.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.50
      yaw_goal_tolerance: 6.28

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False

      # Conservative defaults; tune per robot dynamics.
      min_vel_x: -0.8
      min_vel_y: -0.8
      max_vel_x: 1.6
      max_vel_y: 1.2
      max_vel_theta: 3.0

      min_speed_xy: 0.0
      max_speed_xy: 1.8
      min_speed_theta: 0.0

      acc_lim_x: 2.0
      acc_lim_y: 2.0
      acc_lim_theta: 4.0

      decel_lim_x: -2.0
      decel_lim_y: -2.0
      decel_lim_theta: -4.0

      vx_samples: 10
      vy_samples: 10
      vtheta_samples: 12

      sim_time: 0.4
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 1.5

      xy_goal_tolerance: 0.50
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True

      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
