global_costmap:
  global_costmap:
    ros__parameters:
      # STVL variant for A/B selection in simulation.
      plugins: ["static_layer", "stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: scan_mark scan_clear livox_right_mark livox_right_clear
        scan_mark:
          data_type: LaserScan
          topic: /scan
          marking: true
          clearing: false
          obstacle_range: 4.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: true
          clear_after_reading: true
        scan_clear:
          data_type: LaserScan
          topic: /scan
          marking: false
          clearing: true
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: true
          clear_after_reading: true
        livox_right_mark:
          data_type: PointCloud2
          topic: /segmentation/obstacle_right
          marking: true
          clearing: false
          obstacle_range: 4.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          clear_after_reading: true
          filter: "voxel"
          voxel_min_points: 0
        livox_right_clear:
          enabled: true
          data_type: PointCloud2
          topic: /segmentation/obstacle_right
          marking: false
          clearing: true
          max_z: 3.0
          min_z: -0.2
          vertical_fov_angle: 1.5
          vertical_fov_padding: 0.1
          horizontal_fov_angle: 6.29
          decay_acceleration: 2.0
          model_type: 1
