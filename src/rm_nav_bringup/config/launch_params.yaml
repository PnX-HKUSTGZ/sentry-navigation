# ----------------------------- 运行模式总开关 -----------------------------
# use_sim:
#   true  -> 仿真模式（Gazebo）
#   false -> 实车模式（驱动真实传感器）
use_sim: true

# mode:
#   nav     -> 导航模式（默认会启动定位与 Nav2）
#   mapping -> 建图模式（默认不启动 Nav2，除非 enable_nav2=true）
mode: nav

# enable_nav2:
#   true  -> 启动 Nav2（规划/控制/BT 导航）
#   false -> 不启动 Nav2
# 说明：
#   1) 该项作为 bringup.launch.py 的默认值
#   2) 可被命令行参数覆盖：enable_nav2:=true|false
enable_nav2: true

# nav_rviz:
#   true  -> 启动 Navigation2 RViz（rm_navigation/rviz/nav2.rviz）
#   false -> 不启动 RViz（推荐在无图形环境/压测时使用）
# 说明：
#   1) 该项作为 bringup.launch.py 的默认值
#   2) 可被命令行参数覆盖：nav_rviz:=true|false
nav_rviz: true

# ----------------------------- 赛场/资源选择 -----------------------------
# world:
#   仿真 world 名称（use_sim=true 时生效）
world: RMUL_26

# ----------------------------- 算法主链路选择 ----------------------------
# lio:
#   fastlio | pointlio
lio: fastlio

# localization:
#   amcl | slam_toolbox | icp | small_gicp
localization: slam_toolbox

# controller:
#   dwb | teb
controller: dwb

# use_stvl:
#   全局代价地图是否启用 STVL（true/false）
use_stvl: true

# obstacle_profile:
#   default | anti_self | anti_self_strict | anti_self_lift_test
#   | anti_self_dualspot | anti_self_lowload | anti_self_wiring
obstacle_profile: default

# lidar_noise_stddev:
#   Gazebo 激光噪声标准差（仿真参数）
lidar_noise_stddev: 0.002

# ----------------------------- Follow Mark 联调配置 -----------------------
# follow_mark:
#   enable:
#     true  -> 发布 /chassis/follow_mark
#     false -> 关闭 Follow Mark 发布链路
#   mode:
#     off | zone | hint | zone_and_hint
#   default_value:
#     1 -> 常规模式（默认）
#     0 -> 非常规模式（轮向不跟随标志位）
#   zone_rects:
#     矩形区域数组（每4个值一个矩形: [xmin, xmax, ymin, ymax]）
#     支持扁平写法或嵌套写法，例如：
#       [-1.5, 1.5, -1.5, 1.5]
#       [[-1.5, 1.5, -1.5, 1.5], [2.0, 3.0, -1.0, 1.0]]
#   zone_polygons:
#     多边形区域数组（推荐），每个多边形至少3个顶点。
#     支持两种写法：
#       1) 顶点写法: [[x1, y1], [x2, y2], [x3, y3], ...]
#       2) 扁平写法: [x1, y1, x2, y2, x3, y3, ...]
#     示例：
#       [
#         [[-1.5, -1.5], [1.5, -1.5], [1.5, 1.5], [-1.5, 1.5]],
#         [[2.0, -1.0], [3.0, -1.0], [3.2, 0.8], [2.1, 1.0]]
#       ]
follow_mark:
  enable: true
  mode: zone_and_hint
  topic: /chassis/follow_mark
  manual_topic: /chassis/follow_mark_manual
  hint_topic: /chassis/follow_mark_hint
  input_stale_timeout_sec: 0.3
  default_value: 1
  zone_value: 1
  enter_margin_m: 0.35
  exit_margin_m: 0.55
  zone_rects: []
  zone_polygons: []

# use_lio_rviz:
#   true  -> 启动 LIO 可视化 RViz
#   false -> 不启动 LIO 可视化 RViz
use_lio_rviz: false

# ----------------------------- 雷达外参与双雷达 --------------------------
base_link2livox_frame:
  rpy: '"0.0  0.0  0.0"'
  xyz: '"0.12 0.0 0.175"'

base_link2livox_right_frame:
  rpy: '"0.0 0.0 -0.610865"'
  xyz: '"0.12 -0.14 0.175"'

dual_lidar:
  # enable:
  #   true  -> 启用右侧雷达链路
  #   false -> 仅主雷达
  enable: false
  nav2_consume_right: true
  # obstacle_fusion_mode:
  #   separate -> 左右雷达障碍分别进入 Nav2
  #   merged   -> 融合后作为单一障碍源
  obstacle_fusion_mode: separate
