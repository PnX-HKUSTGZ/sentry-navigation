# ========================================================================
# 哨兵机器人导航系统启动参数配置
# ========================================================================
# 本配置文件用于设定哨兵导航系统的启动参数，支持不同的运行模式和算法组合

# 世界环境名称 - 对应map文件夹中的地图文件名
world: "RMUC_25"

# 运行模式选择
# - "mapping": 建图模式，使用SLAM算法进行环境地图构建
# - "nav": 导航模式，使用预构建地图进行自主导航
mode: "nav"

# 激光雷达惯性里程计(LIO)算法选择
# - "fastlio": FAST-LIO算法，基于卡尔曼滤波器，计算效率高
# - "pointlio": Point-LIO算法，基于点特征匹配，精度较高
lio: "fastlio"

# 定位算法选择 (仅在nav模式下有效)
# - "slam_toolbox": 使用SLAM工具箱进行定位
# - "amcl": 自适应蒙特卡罗定位算法
# - "icp": 基于迭代最近点算法的点云配准定位
localization: "slam_toolbox"

# 环境类型选择
# - true: 使用Gazebo仿真环境
# - false: 使用真实硬件环境
use_sim: true

# 可视化选项
use_lio_rviz: false # 是否启动LIO算法的RViz可视化界面

# 激光雷达坐标系变换参数
# 定义base_link到livox_frame的坐标变换关系
base_link2livox_frame:
  xyz: "\"0.12 0.0 0.175\""  # 位移: x=0.12m, y=0m, z=0.175m
  rpy: "\"0.0  0.0  0.0\""   # 旋转: roll=0°, pitch=0°, yaw=0°