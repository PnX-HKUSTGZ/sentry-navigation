pointcloud_to_laserscan:
  ros__parameters:
    target_frame: 'livox_frame'
    transform_tolerance: 0.01
    # Keep only lower slice to suppress reflections around lidar/chassis height.
    min_height: -1.2
    max_height: -0.10
    angle_min: -3.14159  # -M_PI
    angle_max: 3.14159   # M_PI
    angle_increment: 0.0043  # M_PI/360.0
    scan_time: 0.3333
    # Diagnostic profile:
    # aggressively remove near-field returns around ~1m self-echo zone.
    range_min: 1.05
    range_max: 10.0
    use_inf: true
    inf_epsilon: 1.0
