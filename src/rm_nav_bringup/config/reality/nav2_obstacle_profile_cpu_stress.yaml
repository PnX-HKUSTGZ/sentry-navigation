bt_navigator:
  ros__parameters:
    # Increase BT tick load for CPU pressure tests.
    bt_loop_duration: 5

controller_server:
  ros__parameters:
    # Raise controller loop frequency to stress tf/costmap/controller chain.
    controller_frequency: 40.0

planner_server:
  ros__parameters:
    # Increase global planning loop pressure.
    expected_planner_frequency: 20.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 60.0

recoveries_server:
  ros__parameters:
    cycle_frequency: 8.0

local_costmap:
  local_costmap:
    ros__parameters:
      # Aggressive local costmap refresh/publish rates.
      update_frequency: 40.0
      publish_frequency: 30.0
      always_send_full_costmap: true
      obstacle_layer:
        scan:
          obstacle_min_range: 0.35
          obstacle_max_range: 7.0
          raytrace_max_range: 7.0
        lidar_right:
          obstacle_min_range: 0.35
          obstacle_max_range: 5.5
          raytrace_max_range: 7.0

global_costmap:
  global_costmap:
    ros__parameters:
      # Force high global costmap update/publish load.
      update_frequency: 20.0
      publish_frequency: 15.0
      always_send_full_costmap: true
      stvl_layer:
        # Increase voxel processing and publication overhead.
        publish_voxel_map: true
        voxel_size: 0.03
        voxel_decay: 1.20
        transform_tolerance: 0.10
        livox_mark:
          obstacle_range: 4.5
          min_obstacle_height: 0.15
          max_obstacle_height: 2.2
          observation_persistence: 0.25
          voxel_min_points: 0
        livox_clear:
          min_z: -0.3
          max_z: 4.0
          vertical_fov_angle: 1.7
          vertical_fov_padding: 0.15
