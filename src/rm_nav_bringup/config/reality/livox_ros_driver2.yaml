/livox_lidar_publisher:
  ros__parameters:
    ####################### Livox_ros_driver2 parameters start #######################
    xfer_format: 4    # 0-PointCloud2Msg(PointXYZRTL), 1-LivoxCustomMsg, 2-PclPxyziMsg, 3-LivoxImuMsg, 4-AllMsg
