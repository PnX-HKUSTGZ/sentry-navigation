pointcloud_to_laserscan:
  ros__parameters:
    target_frame: 'livox_frame'
    transform_tolerance: 0.01
    # Deliberately increase buffering and projection density for CPU stress.
    queue_size: 30
    # Keep stress profile observable but bounded: stale frames are dropped instead of
    # accumulating until tf cache underflow.
    warn_cloud_delay_sec: 0.05
    drop_cloud_delay_sec: 0.20
    warn_processing_time_ms: 8.0
    min_height: -1.2
    max_height: 0.2
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.001745
    scan_time: 0.10
    range_min: 0.20
    range_max: 12.0
    use_inf: true
    inf_epsilon: 1.0
