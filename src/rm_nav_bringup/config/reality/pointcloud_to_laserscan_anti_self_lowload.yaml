pointcloud_to_laserscan:
  ros__parameters:
    target_frame: 'livox_frame'
    # 稍放宽 TF 容差，降低高负载时的 message filter 掉包。
    transform_tolerance: 0.03
    # 控制输入队列，避免处理落后后累积旧帧。
    queue_size: 2
    min_height: -1.0
    max_height: 0.05
    angle_min: -3.14159  # -M_PI
    angle_max: 3.14159   # M_PI
    # 降低角分辨率，减轻 p2ls / slam_toolbox / costmap 负载。
    angle_increment: 0.01047
    scan_time: 0.3333
    range_min: 0.45
    range_max: 10.0
    use_inf: true
    inf_epsilon: 1.0

    # 针对抬头姿态下的前向双点伪障碍（经验扇区）。
    exclude_range_min: 0.75
    exclude_range_max: 1.35
    exclude_angle_ranges_deg: [-20.0, 20.0]
