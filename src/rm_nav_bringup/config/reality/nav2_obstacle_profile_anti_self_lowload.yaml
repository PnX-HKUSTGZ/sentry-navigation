local_costmap:
  local_costmap:
    ros__parameters:
      # 降低局部代价地图刷新开销，减轻多 RViz 场景的 CPU 压力。
      update_frequency: 12.0
      publish_frequency: 4.0
      obstacle_layer:
        scan:
          obstacle_min_range: 0.45
          obstacle_max_range: 5.0
          raytrace_max_range: 5.0
        lidar_right:
          obstacle_min_range: 0.60
          obstacle_max_range: 3.0
      inflation_layer:
        inflation_radius: 0.50
      always_send_full_costmap: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      always_send_full_costmap: false
      stvl_layer:
        publish_voxel_map: false
        voxel_decay: 0.30
        transform_tolerance: 0.30
        livox_mark:
          obstacle_range: 2.4
          min_obstacle_height: 0.25
          max_obstacle_height: 1.8
          observation_persistence: 0.08
          voxel_min_points: 3
        livox_clear:
          min_z: -0.2
          max_z: 3.0
          vertical_fov_angle: 1.5
          vertical_fov_padding: 0.08
